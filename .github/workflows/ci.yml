name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    name: Check Python code
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tool
        run: python -m pip install ruff==0.11.13

      - name: Check Python syntax
        run: python -m compileall -q scripts

      - name: Check for critical Python errors
        run: python -m ruff check scripts --select E9,F63,F7,F82